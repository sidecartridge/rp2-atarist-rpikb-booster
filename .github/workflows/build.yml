name: Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.build_type }} / ${{ matrix.board_flavor }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]
        build_type: [release, debug]
        board_flavor: [croissant, souffle]
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the Pico toolchain
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt update
          sudo DEBIAN_FRONTEND=noninteractive apt install -y \
            build-essential \
            cmake \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib

      - name: Install AtariST toolkit Docker image
        run: curl -sL https://github.com/sidecartridge/atarist-toolkit-docker/releases/download/latest/install_atarist_toolkit_docker.sh | bash

      - name: Build firmware
        run: ./build.sh pico2_w ${{ matrix.build_type }} final ${{ matrix.board_flavor }}

      - name: Stage artifacts
        run: |
          version=$(tr -d '\r\n ' < version.txt)
          mkdir -p artifacts
          booster_name="booster-pico2_w-${{ matrix.board_flavor }}.uf2"
          full_name="ikbd-booster-${version}-full.uf2"
          staged_full_name="ikbd-booster-${version}-${{ matrix.board_flavor }}-full.uf2"

          if [ "${{ matrix.build_type }}" = "debug" ]; then
            booster_name="booster-pico2_w-${{ matrix.board_flavor }}-debug.uf2"
            full_name="ikbd-booster-${version}-debug-full.uf2"
            staged_full_name="ikbd-booster-${version}-${{ matrix.board_flavor }}-debug-full.uf2"
          fi

          cp "booster/dist/${booster_name}" artifacts/
          cp "dist/${full_name}" "artifacts/${staged_full_name}"
